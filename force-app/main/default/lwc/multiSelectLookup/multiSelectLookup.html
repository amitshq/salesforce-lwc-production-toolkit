<template>
    <div class="slds-form-element">
        <label if:true={label} class="slds-form-element__label" for="lookup-input">
            {label}
            <abbr if:true={required} class="slds-required" title="required">*</abbr>
        </label>

        <template if:true={hasSelection}>
            <ul class="slds-listbox slds-listbox_horizontal slds-p-bottom_xx-small" role="list">
                <template for:each={_selectedRecords} for:item="record">
                    <li key={record.id} class="slds-listbox-item">
                        <span class="slds-pill">
                            <span class="slds-pill__label">{record.label}</span>
                            <button
                                type="button"
                                class="slds-button slds-button_icon slds-pill__remove"
                                title="Remove"
                                data-id={record.id}
                                onclick={handleRemove}
                                disabled={disabled}
                            >
                                <lightning-icon icon-name="utility:close" size="xx-small" alternative-text="Remove"></lightning-icon>
                            </button>
                        </span>
                    </li>
                </template>
            </ul>
        </template>

        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_left slds-is-relative">
            <lightning-icon icon-name="utility:search" size="x-small" class="slds-input__icon slds-input__icon_left"></lightning-icon>
            <input
                id="lookup-input"
                type="text"
                class="slds-input"
                placeholder={placeholder}
                value={searchTerm}
                disabled={disabled}
                oninput={handleInputChange}
                onkeydown={handleKeydown}
                onblur={handleBlur}
                role="combobox"
                aria-expanded={isDropdownOpen}
                autocomplete="off"
            />
            <template if:true={hasResults}>
                <div class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid">
                    <ul class="slds-listbox slds-listbox_vertical" role="listbox">
                        <template for:each={visibleResults} for:item="result">
                            <li key={result.id} role="presentation" class="slds-listbox__item">
                                <div class={result.itemClass} data-id={result.id} onclick={handleResultClick}>
                                    <span class="slds-media__body">{result.label}</span>
                                </div>
                            </li>
                        </template>
                    </ul>
                </div>
            </template>
            <template if:true={showNoResults}>
                <div class="slds-dropdown slds-dropdown_fluid slds-p-around_small slds-text-color_weak">No results.</div>
            </template>
        </div>
        <template if:true={errorMessage}>
            <div class="slds-form-element__help">{errorMessage}</div>
        </template>
    </div>
</template>
