<template>
    <lightning-card title={title} icon-name="standard:related_list">
        <template if:true={enableExport}>
            <lightning-button-icon
                slot="actions"
                class="export-button slds-m-right_xx-small"
                icon-name="utility:download"
                alternative-text="Export all matching records to CSV"
                title="Export all matching records to CSV"
                disabled={isExporting}
                onclick={handleExportClick}
            ></lightning-button-icon>
        </template>
        <template if:true={enableColumnChooser}>
            <lightning-button-icon
                slot="actions"
                icon-name="utility:table_settings"
                variant={columnChooserVariant}
                alternative-text="Choose columns"
                title="Choose columns"
                class="slds-m-right_xx-small"
                onclick={handleColumnChooserToggle}
            ></lightning-button-icon>
        </template>
        <template if:false={hideRefreshButton}>
            <lightning-button-icon
                slot="actions"
                icon-name="utility:refresh"
                alternative-text="Refresh"
                title="Refresh"
                onclick={handleRefreshClick}
            ></lightning-button-icon>
        </template>

        <template if:true={hasViewBar}>
            <c-datatable-view-bar
                view-key={viewKey}
                object-api-name={objectApiName}
                current-config={currentConfig}
                onviewsready={handleViewsReady}
                onviewselect={handleViewSelect}
            ></c-datatable-view-bar>
        </template>

        <template if:true={showColumnChooser}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <c-column-chooser
                    columns={columnChooserItems}
                    visible-fields={visibleFields}
                    onchange={handleVisibleFieldsChange}
                ></c-column-chooser>
            </div>
        </template>

        <template if:true={hasSearch}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <lightning-input
                    type="search"
                    label="Search"
                    variant="label-hidden"
                    placeholder={searchPlaceholder}
                    value={searchTerm}
                    onchange={handleSearchInput}
                ></lightning-input>
            </div>
        </template>

        <template if:true={hasFilterableColumns}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small slds-grid slds-wrap slds-gutters_x-small">
                <template for:each={filterInputs} for:item="filterInput">
                    <div key={filterInput.fieldName} class="slds-col slds-size_1-of-4 slds-p-bottom_x-small">
                        <lightning-input
                            label={filterInput.label}
                            variant="label-stacked"
                            value={filterInput.value}
                            data-field-name={filterInput.fieldName}
                            onchange={handleColumnFilterInput}
                        ></lightning-input>
                    </div>
                </template>
            </div>
        </template>

        <template if:true={hasPendingChanges}>
            <div class="slds-p-horizontal_medium slds-p-bottom_small">
                <div class="slds-notify slds-notify_alert slds-theme_info slds-grid slds-grid_vertical-align-center" role="status">
                    <span class="slds-col slds-has-flexi-truncate">{changesNotice}</span>
                    <lightning-button label="Refresh" variant="inverse" onclick={handleRefreshClick}></lightning-button>
                </div>
            </div>
        </template>

        <template if:true={hasUndo}>
            <div class="undo-bar slds-p-horizontal_medium slds-p-bottom_small">
                <div class="slds-notify slds-notify_alert slds-theme_alt-inverse slds-grid slds-grid_vertical-align-center" role="status">
                    <span class="slds-col slds-has-flexi-truncate">{undoState.message}</span>
                    <lightning-button
                        class="undo-button"
                        label="Undo"
                        variant="inverse"
                        disabled={isRestoring}
                        onclick={handleUndoDelete}
                    ></lightning-button>
                    <lightning-button-icon
                        class="undo-dismiss slds-m-left_x-small"
                        icon-name="utility:close"
                        variant="bare-inverse"
                        alternative-text="Dismiss"
                        title="Dismiss"
                        onclick={handleUndoDismiss}
                    ></lightning-button-icon>
                </div>
            </div>
        </template>

        <template if:true={isExporting}>
            <div class="export-progress slds-p-horizontal_medium slds-p-bottom_small slds-grid slds-grid_vertical-align-center" role="status">
                <lightning-spinner alternative-text="Exporting" size="x-small" class="slds-is-relative slds-m-right_small"></lightning-spinner>
                <span class="slds-col">{exportProgressLabel}</span>
                <lightning-button class="export-cancel" label="Cancel export" onclick={handleCancelExport}></lightning-button>
            </div>
        </template>

        <template if:true={hasSaveProgress}>
            <p class="save-progress slds-p-horizontal_medium slds-p-bottom_small slds-text-body_small" role="status">{saveProgress}</p>
        </template>

        <c-state-manager
            is-loading={isInitialLoading}
            has-error={hasError}
            error-message={errorMessage}
            is-empty={isEmpty}
            empty-title="No records found"
        >
            <!-- The two tables take the same attributes: keep them in step. -->
            <template if:true={usesExtendedTypes}>
                <c-extended-datatable
                    class="records-table"
                    key-field={keyField}
                    data={records}
                    columns={tableColumns}
                    sorted-by={tableSortedBy}
                    sorted-direction={sortedDirection}
                    onsort={handleSort}
                    draft-values={draftValues}
                    oncellchange={handleCellChange}
                    onsave={handleSave}
                    oncancel={handleCancelEdit}
                    errors={datatableErrors}
                    is-loading={isReloading}
                    hide-checkbox-column={hideCheckboxColumn}
                    onrowselection={handleRowSelection}
                    onrowaction={handleRowAction}
                    selected-rows={selectedRowKeys}
                ></c-extended-datatable>
            </template>
            <template if:false={usesExtendedTypes}>
                <lightning-datatable
                    class="records-table"
                    key-field={keyField}
                    data={records}
                    columns={tableColumns}
                    sorted-by={tableSortedBy}
                    sorted-direction={sortedDirection}
                    onsort={handleSort}
                    draft-values={draftValues}
                    oncellchange={handleCellChange}
                    onsave={handleSave}
                    oncancel={handleCancelEdit}
                    errors={datatableErrors}
                    is-loading={isReloading}
                    hide-checkbox-column={hideCheckboxColumn}
                    onrowselection={handleRowSelection}
                    onrowaction={handleRowAction}
                    selected-rows={selectedRowKeys}
                ></lightning-datatable>
            </template>
        </c-state-manager>

        <template if:true={hasTotals}>
            <div class="totals slds-p-horizontal_small slds-p-vertical_x-small slds-border_top" aria-live="polite">
                <template if:true={hasTotalsError}>
                    <p class="totals-error slds-text-body_small slds-text-color_error">{totalsError}</p>
                </template>
                <template if:false={hasTotalsError}>
                    <p class="slds-text-body_small slds-text-color_weak">{totalsCaption}</p>
                    <dl class="totals-list slds-grid slds-wrap">
                        <template for:each={totalsItems} for:item="item">
                            <div key={item.key} class="totals-item slds-m-right_large">
                                <dt class="slds-text-body_small slds-text-color_weak">{item.label}</dt>
                                <dd class="totals-value slds-text-heading_small">{item.value}</dd>
                            </div>
                        </template>
                    </dl>
                </template>
            </div>
        </template>

        <c-bulk-action-bar
            selected-count={selectedRows.length}
            actions={resolvedBulkActions}
            onaction={handleBulkAction}
            onclear={handleBulkActionClear}
        ></c-bulk-action-bar>

        <template if:true={isPagesMode}>
            <div class="slds-p-around_small slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                <lightning-button label="Previous" onclick={handlePreviousClick} disabled={isFirstPage}></lightning-button>
                <span class="slds-text-body_small slds-text-color_weak">{pageStatusLabel}</span>
                <lightning-button label="Next" onclick={handleNextClick} disabled={isLastPage}></lightning-button>
            </div>
        </template>

        <template if:true={isInfiniteMode}>
            <c-infinite-scroll-loader
                is-loading={isLoadingMore}
                disabled={isLoadMoreDisabled}
                onloadmore={handleLoadMore}
            ></c-infinite-scroll-loader>
        </template>

        <template if:true={showPagingCapMessage}>
            <p class="paging-cap slds-p-horizontal_small slds-p-bottom_small slds-text-body_small slds-text-color_weak">
                {pagingCapMessage}
            </p>
        </template>
    </lightning-card>
</template>
