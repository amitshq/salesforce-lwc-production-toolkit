<template>
    <template if:true={isOpen}>
        <section
            class={sectionClass}
            role="dialog"
            aria-modal="true"
            aria-labelledby={headingId}
            tabindex="-1"
        >
            <!-- Focus guards: Tab past the last control or Shift+Tab before the first lands on one, and focus wraps round. -->
            <span class="focus-guard" data-guard="start" tabindex="0" onfocus={handleStartGuardFocus}></span>
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <template if:false={hideCloseButton}>
                        <button
                            type="button"
                            class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close"
                            onclick={handleCloseButtonClick}
                        >
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                    </template>
                    <h1 id={headingId} class="slds-modal__title slds-hyphenate">{headerLabel}</h1>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <slot></slot>
                </div>
                <footer class="slds-modal__footer">
                    <slot name="footer"></slot>
                </footer>
            </div>
            <span class="focus-guard" data-guard="end" tabindex="0" onfocus={handleEndGuardFocus}></span>
        </section>
        <div class="slds-backdrop slds-backdrop_open" onclick={handleBackdropClick}></div>
    </template>
</template>
