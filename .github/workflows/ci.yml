name: CI

# Jest + ESLint on every pull request to dev and every push to dev. Pull
# requests from forks run with a read-only token and no secrets, which is all
# this job needs.
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  js:
    name: Lint and Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # The website's release timer and catalog: dates, links, and that every component and Apex service is listed.
      - run: npm run test:site
